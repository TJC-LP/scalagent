rules = [
  OrganizeImports
]

OrganizeImports {
  # Use * for wildcard imports (Scala 3 standard)
  renameWildcard = "*"

  # Group and sort imports
  groups = [
    "com.tjclp."
    "zio."
    "scala."
    "java."
    "*"
  ]

  groupedImports = Merge
  importSelectorsOrder = Ascii
  removeUnused = false
}
